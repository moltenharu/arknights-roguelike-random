/* -------------------------

];


/* -------------------------

   ------------------------- */

const ascensions = [];

for (let i = 0; i <= 18; i++) {
    ascensions.push(i);
}


/* =========================================================
   여기부터 아래 코드는 건드리지 않아도 됩니다.
   ========================================================= */


/*
   일반 랜덤
*/

function randomChoice(array) {
    return array[Math.floor(Math.random() * array.length)];
}


/*
   가중치 랜덤

   예:
   A = 10
   B = 10
   C = 5

   그러면 C가 A/B보다 절반 정도의 확률로 나옵니다.
*/

function weightedRandom(array) {

    let totalWeight = 0;

    for (const item of array) {
        totalWeight += item.weight;
    }

    let random = Math.random() * totalWeight;

    for (const item of array) {

        random -= item.weight;

        if (random < 0) {
            return item;
        }
    }

}


/*
   챌린지 생성
*/

function generateChallenge() {

    // 1. 테마 선택
    const themeNames = Object.keys(themes);

    const themeName = randomChoice(themeNames);

    const themeData = themes[themeName];


    // 2. 승천 선택
    const ascension = randomChoice(ascensions);


    // 3. 해당 테마의 분대 선택
    const squad = weightedRandom(themeData.squads);


    // 4. 첫 6성 직군 선택
    const firstClass = randomChoice(classes);


    // 5. 해당 테마의 엔딩 선택
    const ending = weightedRandom(themeData.endings);


    // 6. 화면에 출력

    document.getElementById("theme").textContent = themeName;

    document.getElementById("ascension").textContent =
        ascension + "승천";

    document.getElementById("squad").textContent =
        squad.name;

    document.getElementById("class").textContent =
        firstClass;

    document.getElementById("ending").textContent =
        ending.name;
}
